name: Render picker review images

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to render
        default: master
        required: false
      filter:
        description: Swift test filter producing the renders
        default: CapturePickerDesignTests/testRenderPickerCardStatesToPNG
        required: false

jobs:
  render:
    name: Render picker PNGs
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Show toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Render picker review images
        run: |
          set -euo pipefail
          render_dir="${RUNNER_TEMP}/picker-renders"
          mkdir -p "${render_dir}"
          BOB_MAC_CAPTURE_RENDER_DIR="${render_dir}" ./Scripts/xcode-swift.sh test --filter "${{ inputs.filter }}"
          ls -la "${render_dir}"

      - name: Upload renders
        uses: actions/upload-artifact@v4
        with:
          name: picker-renders
          path: ${{ runner.temp }}/picker-renders
