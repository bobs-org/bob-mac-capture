name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  macos:
    name: macOS 26 SwiftPM
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          ./Scripts/xcode-swift.sh --version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          major="${sdk_version%%.*}"
          test "${major}" -ge 26

      - name: Lint Swift formatting
        run: |
          set -euo pipefail
          if command -v swift-format >/dev/null 2>&1; then
            swift-format lint --recursive Package.swift Sources Tests
          else
            ./Scripts/xcode-swift.sh format lint --recursive Package.swift Sources Tests
          fi

      - name: Build
        run: ./Scripts/xcode-swift.sh build

      - name: Test
        run: ./Scripts/xcode-swift.sh test

      - name: Bundle
        run: ./Scripts/bundle.sh --identity "-"

      - name: Verify plist and signature
        run: |
          set -euo pipefail
          app=".build/bundle/Bob Mac Capture.app"
          plutil -lint "${app}/Contents/Info.plist"
          codesign --verify --deep --strict "${app}"
          identifier="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${app}/Contents/Info.plist")"
          test "${identifier}" = "org.bobs.bob-mac-capture"

      - name: Launch smoke test
        id: launch_smoke_test
        run: |
          set -euo pipefail
          app=".build/bundle/Bob Mac Capture.app"
          bundle_id="org.bobs.bob-mac-capture"
          launch_start="$(date '+%Y-%m-%d %H:%M:%S')"
          log_file="${PWD}/launch-smoke-test.log"
          pid=""

          # Runs on every exit path (success, `exit 1`, or an unhandled failure under
          # `set -e`) so the app never lingers on the runner and the filtered log is
          # always captured for the upload step below.
          cleanup() {
            if [[ -n "${pid}" ]]; then
              kill "${pid}" 2>/dev/null || true
              for _ in $(seq 1 10); do
                kill -0 "${pid}" 2>/dev/null || break
                sleep 1
              done
            fi
            log show --signpost --predicate "subsystem == \"${bundle_id}\"" --start "${launch_start}" \
              >"${log_file}" 2>&1 || true
          }
          trap cleanup EXIT

          # Launch through LaunchServices, the same path a user's click or login item
          # takes, rather than executing the binary directly.
          open "${app}"

          for _ in $(seq 1 30); do
            pid="$(pgrep -x BobMacCapture || true)"
            if [[ -n "${pid}" ]]; then
              break
            fi
            sleep 1
          done
          if [[ -z "${pid}" ]]; then
            echo "::error::BobMacCapture never appeared in the process list after launch"
            exit 1
          fi

          # An `LSUIElement` app with a broken entry point still launches an empty AppKit
          # event loop rather than crashing, so a bare process-exists check would pass on
          # the exact regression this gate exists to catch. Settling first only rules out
          # an immediate crash-on-launch.
          sleep 5
          if ! kill -0 "${pid}" 2>/dev/null; then
            echo "::error::BobMacCapture exited shortly after launch (pid ${pid})"
            exit 1
          fi

          # The real assertion: `applicationDidFinishLaunching` completing (delegate
          # assigned, status item configured, hotkey registered) is what emits this
          # signpost as its last statement. A live process alone does not prove it ran.
          found_signpost=""
          for _ in $(seq 1 20); do
            if log show --signpost --predicate "subsystem == \"${bundle_id}\"" --start "${launch_start}" 2>/dev/null \
                | grep -q "launch-complete"; then
              found_signpost=1
              break
            fi
            sleep 1
          done
          if [[ -z "${found_signpost}" ]]; then
            echo "::error::launch-complete signpost never appeared in the unified log; applicationDidFinishLaunching did not complete"
            exit 1
          fi

      - name: Upload launch smoke test diagnostics
        if: failure() && steps.launch_smoke_test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: launch-smoke-test-diagnostics
          path: |
            launch-smoke-test.log
            ~/Library/Logs/DiagnosticReports/
          if-no-files-found: ignore

      - name: Install and reinstall
        run: |
          set -euo pipefail
          temp_home="$(mktemp -d)"
          stdout="$(mktemp)"
          trap 'rm -rf "${temp_home}" "${stdout}"' EXIT

          expected_path="${temp_home}/Applications/Bob Mac Capture.app"

          verify_install() {
            test "$(cat "${stdout}")" = "${expected_path}"
            test -d "${expected_path}"
            plutil -lint "${expected_path}/Contents/Info.plist"
            codesign --verify --deep --strict "${expected_path}"
            identifier="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${expected_path}/Contents/Info.plist")"
            test "${identifier}" = "org.bobs.bob-mac-capture"
          }

          HOME="${temp_home}" ./Scripts/install.sh --target '~/Applications' --identity "-" >"${stdout}"
          verify_install

          HOME="${temp_home}" ./Scripts/install.sh --target '~/Applications' --identity "-" >"${stdout}"
          verify_install
